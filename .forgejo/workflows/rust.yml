name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: rust

    steps:
      - uses: actions/checkout@v7

      # Cache is not usable for now
      # - uses: actions/cache@v6
      #   with:
      #     path: |
      #       ~/.cargo/registry
      #       ~/.cargo/git
      #       target
      #     key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: optimize network
        run: sed -ie 's|https://github.com/LGY07/toasty-driver-turso|https://git.feniota.org/tuxium/toasty-driver-turso|' Cargo.toml

      - name: Rustfmt
        run: cargo fmt -- --check

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Clippy
        run: cargo clippy --no-deps -- -D warnings
