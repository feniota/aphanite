name: Frontend checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: fedora44
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint with Oxlint
        run: pnpm exec oxlint

      - name: Lint with ESLint
        run: pnpm exec eslint

      - name: Lint with Svelte compiler
        run: pnpm check

      - name: Check if code is correctly formatted
        run: pnpm exec oxfmt --check

      - name: Check if frontend code compiles
        run: pnpm exec vite build web/
