name: Frontend checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint with Oxlint
        run: pnpm lint

      - name: Lint with Svelte compiler
        run: pnpm check

      - name: Check if code is correctly formatted
        run: pnpm exec oxfmt --check

      - name: Check if frontend code compiles
        run: pnpm exec vite build web/
