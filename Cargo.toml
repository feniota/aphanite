[package]
name = "aphanite"
version = "0.3.0-dev"
edition = "2024"
autotests = false

[[test]]
name = "integration_test"
path = "tests/rust/main.rs"

[dependencies]
# Async & Runtime
async-channel = "2.5"
compio = { version = "0.19", default-features = false, features = ["io-uring", "polling", "fs"] }
futures-lite = "2.6"

# Web & HTTP
ntex = { version = "4.9", features = ["rustls", "compio", "trace"] }
multer = "3.1"
forwarded-header-value = "0.1"
bytes = "1.12"
url = { version = "2.5", features = ["serde"] }

# Database & ORM
scc = "3.8"
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "sqlx-postgres"] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
  "sqlx-sqlite",
  "sqlx-postgres",
] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-smol",
  "tls-rustls-aws-lc-rs",
  "sqlite",
  "postgres",
] }

# Serialization & Configuration
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Cryptography & Authentication
argon2 = { version = "0.6", features = ["password-hash", "alloc"] }
base64 = "0.23"
blake3 = "1.8"
rand = "0.10"
rsa = { version = "0.10", features = ["serde", "sha1", "pkcs1v15"] }
sha1 = "0.11"
totp-rs = { version = "6.0", features = ["gen_secret", "otpauth"] }
uuid = { version = "1.23", features = ["serde", "v7"] }

# Storage & Assets
rust-embed = { version = "8.12", features = ["mime-guess"] }
rusty-s3 = { version = "0.12", default-features = false, features = ["aws-lc-rs"] }
image = { version = "0.25", default-features = false, features = ["png"] }
infer = "0.22"

# TLS & Certificates
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rustls-acme = "0.15"
rustls-platform-verifier = { version = "0.7", optional = true }

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities & Performance
anyhow = "1.0"
mimalloc = { version = "0.1", features = ["override"] }
strum = { version = "0.28", features = ["derive"] }

[features]
default = []
native-certs = ["dep:rustls-platform-verifier"]

[[bench]]
name = "backend"
harness = false

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
  "html_reports",
  "plotters",
] }
tempfile = "3.27"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true
