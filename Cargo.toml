[package]
name = "aphanite"
version = "0.1.1"
edition = "2024"
build = "./build/build.rs"

[dependencies]
anyhow = "1.0"
argon2 = { version = "0.6", features = ["password-hash", "alloc"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-client-ip = { version = "1.3", features = ["forwarded-header"] }
axum-reverse-proxy = { version = "2.2", default-features = false }
base64 = "0.23"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
infer = "0.22"
jiff = "0.2"
mimalloc = { version = "0.1", features = ["override", "v2"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rsa = { version = "0.10.0-rc", features = ["serde", "sha1"] }
rust-embed = { version = "8.12", features = ["mime-guess"] }
rust-s3 = { version = "0.38", default-features = false, features = [
  "fail-on-err",
  "tags",
  "tokio-rustls-tls",
] }
scc = "3.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
shadow-rs = "2.0"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
toasty = { version = "0.11", default-features = false, features = ["jiff", "serde", "postgresql"] }
toasty-driver-turso = { git = "https://github.com/LGY07/toasty-driver-turso", features = ["jiff"] }
tokio = { version = "1.52", features = ["full"] }
tokio-cron-scheduler = "0.15"
tokio-postgres = "0.7"
tokio-stream = { version = "0.1", features = ["full"] }
tokio-util = "0.7"
toml = "1.1"
totp-rs = { version = "6.0", features = ["gen_secret", "otpauth"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turso = { version = "0.8", default-features = false }
url = "2.5"
uuid = { version = "1.23", features = ["serde", "v7"] }
webpki-root-certs = { version = "1.0", optional = true }

[features]
default = []
bundle-certs = ["dep:webpki-root-certs"]

[build-dependencies]
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true
